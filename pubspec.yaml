name: starter
description: A compact, reusable, cross-platform Flutter application starter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0 <3.45.0"

dependencies:
  app_links: ^6.4.0
  app_settings: ^8.0.3
  clock: ^1.1.2
  connectivity_plus: ^7.3.1
  cross_file: ^0.3.5+4
  crypto: ^3.0.6
  exui: ^1.0.11
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_tvos: ^1.1.2
  forui: ^0.24.1
  go_router: ^17.3.0
  image_picker: ^1.2.3
  in_app_update: ^4.2.3
  intl: ^0.20.2
  local_auth: ^2.3.0
  package_info_plus: ^10.2.1
  package_info_plus_tvos: ^0.0.1
  path_provider: ^2.1.5
  path_provider_tvos: ^0.0.3
  permission_handler: ^12.0.3
  posthog_flutter: ^5.33.0
  pub_semver: ^2.1.0
  sensors_plus: ^6.1.1
  sentry_flutter: ^9.25.0
  share_plus: ^13.0.0
  shared_preferences: ^2.5.5
  shared_preferences_tvos: ^0.0.2
  simple_animations: ^5.3.0
  slang: ^4.18.0
  slang_flutter: ^4.18.0
  talker_flutter: ^5.1.19
  url_launcher: ^6.2.5

dev_dependencies:
  build_runner: ^2.15.1
  connectivity_plus_platform_interface: ^2.1.0
  fake_async: ^1.3.3
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  forui_cli: ^0.24.0
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  slang_build_runner: ^4.18.0
  very_good_analysis: ^10.3.0

flutter:
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/Noto_Sans/NotoSans.ttf
        - asset: assets/fonts/Noto_Sans/NotoSans-Italic.ttf
          style: italic
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/Noto_Sans_Arabic/NotoSansArabic.ttf
          weight: 400
        - asset: assets/fonts/Noto_Sans_Arabic/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/Noto_Sans_Arabic/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Noto_Sans_Arabic/NotoSansArabic-Bold.ttf
          weight: 700
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/Noto_Sans_SC/NotoSansSC.ttf
  uses-material-design: true
