include: package:very_good_analysis/analysis_options.yaml

plugins:
  riverpod_lint: 3.1.4

analyzer:
  exclude:
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

formatter:
  page_width: 100
  trailing_commas: preserve

linter:
  rules:
    # This is an application, so its internal public surface is documented at
    # architectural boundaries rather than requiring API-doc prose everywhere.
    public_member_api_docs: false
    # Keep analyzer and formatter policy aligned with the reviewed 100-column width.
    lines_longer_than_80_chars: false
