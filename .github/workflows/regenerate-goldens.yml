name: Regenerate goldens

# Regenerates the canonical golden baselines on the pinned macOS 26 runner
# (the authoritative baseline environment per test/goldens/README.md), opens a
# PR with the updated PNGs for review, and verifies the regenerated baselines
# pass a clean comparison on the same environment.
#
# Never run `--update-goldens` anywhere else: baselines are pixel-exact against
# the pinned macOS minor version, Flutter 3.44.7, and its engine, so a local
# regen would poison CI.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate-goldens
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.7
  DEV_CONFIG: config/development.json

jobs:
  regenerate:
    name: macOS 26 baseline regeneration
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Regenerate the canonical baselines
        run: >
          flutter test test/goldens/canonical_matrix_golden_test.dart
          --update-goldens --dart-define-from-file=$DEV_CONFIG

      - name: Verify the regenerated baselines pass a clean comparison
        run: >
          flutter test test/goldens/canonical_matrix_golden_test.dart
          --dart-define-from-file=$DEV_CONFIG

      - name: Detect changed baselines
        id: changed
        run: |
          git add test/goldens/baselines
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request with the regenerated baselines
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "golden-bot"
          git config user.email "actions@github.com"
          BRANCH="goldens/regen-${GITHUB_RUN_NUMBER}"
          git checkout -b "$BRANCH"
          git commit -m "chore(goldens): regenerate canonical baselines on macos-26 (run ${GITHUB_RUN_NUMBER})"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(goldens): regenerate canonical baselines (macos-26, run ${GITHUB_RUN_NUMBER})" \
            --body "Regenerated by the pinned macOS 26 runner (Flutter ${FLUTTER_VERSION}). Inspect every changed PNG before merging — baseline changes are visual acceptances, not mechanical updates (test/goldens/README.md)." \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          if [ "${{ steps.changed.outputs.changed }}" == "true" ]; then
            echo "Baselines regenerated; a PR was opened for review."
          else
            echo "Baselines already matched — no changes needed."
          fi
