name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  ubuntu-quality:
    name: Ubuntu / quality and non-golden tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: |
          flutter pub get
          # `dart format .` recurses into the standalone tools/test_server
          # package. Resolve it too, otherwise the formatter cannot read its
          # analysis_options.yaml (`include: package:lints/recommended.yaml`,
          # `formatter: page_width: 100`) and silently falls back to the default
          # 80-column width — flagging the correctly 100-column-formatted files
          # as changed.
          (cd tools/test_server && dart pub get)

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run fatal static analysis
        run: flutter analyze --fatal-infos

      - name: Check generated-code drift
        shell: bash
        run: |
          # build_runner 2.15+ removed --delete-conflicting-outputs; running
          # `build` over the committed generated files throws
          # InvalidOutputException ("Asset already exists"). Delete them first
          # so the builder regenerates cleanly, then fail on any real drift.
          # slang output is deterministic (build.yaml: timestamp: false).
          rm -f lib/i18n/*.g.dart
          dart run build_runner build
          git diff --exit-code
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi

      - name: Set up Bun
        # tools/hono_server's E2E group boots a live JS server; the repo
        # documents bun as that runtime. Install it so the group runs (and
        # passes) instead of falling back to a dependency-less `npx tsx` that
        # cannot resolve the `hono` import.
        uses: oven-sh/setup-bun@v2

      - name: Install hono_server dependencies
        working-directory: tools/hono_server
        run: bun install

      - name: Run all non-golden unit and widget tests
        shell: bash
        run: |
          mapfile -d '' test_files < <(
            find test -type f -name '*_test.dart' \
              ! -path 'test/goldens/*' -print0
          )
          if (( ${#test_files[@]} == 0 )); then
            echo 'No non-golden tests were discovered.' >&2
            exit 1
          fi
          flutter test "${test_files[@]}"

  linux-integration:
    name: Ubuntu / Linux integration targets
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux desktop and display prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            libsecret-1-dev \
            libstdc++-12-dev \
            ninja-build \
            pkg-config \
            xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run development smoke test under Xvfb
        run: >-
          xvfb-run -a
          flutter test integration_test/development_smoke_test.dart
          -d linux
          --dart-define-from-file=config/development.json

      - name: Run production route policy test under Xvfb
        run: >-
          xvfb-run -a
          flutter test integration_test/production_routes_test.dart
          -d linux
          --dart-define-from-file=config/production.json

      - name: Run injected TV remote smoke test under Xvfb
        run: >-
          xvfb-run -a
          flutter test integration_test/tv_remote_smoke_test.dart
          -d linux
          --dart-define-from-file=config/development.json

  ubuntu-release-builds:
    name: Ubuntu / Android and Linux release builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            libsecret-1-dev \
            libstdc++-12-dev \
            ninja-build \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate Android TV source manifest and resources
        run: python3 tool/android_tv/validate_android_tv.py

      - name: Build Android APK with production configuration
        run: >-
          flutter build apk --release
          --dart-define-from-file=config/production.json

      - name: Validate merged Android TV manifest
        shell: bash
        run: |
          merged_manifest="$(
            find build/app/intermediates/merged_manifest/release \
              -name AndroidManifest.xml -print -quit
          )"
          if [[ -z "$merged_manifest" ]]; then
            echo 'Release merged manifest was not found.' >&2
            exit 1
          fi
          python3 tool/android_tv/validate_android_tv.py \
            --merged-manifest "$merged_manifest"

      - name: Validate Android release ABIs and 16 KB zip alignment
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          unzip -Z1 "$apk" | grep -q '^lib/armeabi-v7a/libflutter\.so$'
          unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/libflutter\.so$'
          build_tools="$(
            find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 \
              -type d -print | sort -V | tail -n 1
          )"
          "$build_tools/zipalign" -c -P 16 -v 4 "$apk"

      - name: Build Android App Bundle with production configuration
        run: >-
          flutter build appbundle --release
          --dart-define-from-file=config/production.json

      - name: Build Linux bundle with production configuration
        run: >-
          flutter build linux --release
          --dart-define-from-file=config/production.json

  macos-goldens-and-release-builds:
    name: macOS / canonical goldens and Apple release builds
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Compare canonical macOS golden baselines
        # Baselines are generated on this macos-26 runner image (see
        # test/goldens/README.md). After a runner-image bump, re-run the
        # "Regenerate goldens" workflow and commit the reviewed baselines.
        run: flutter test test/goldens/canonical_matrix_golden_test.dart

      - name: Build unsigned iOS release with production configuration
        run: >-
          flutter build ios --release --no-codesign
          --dart-define-from-file=config/production.json

      - name: Build macOS release with production configuration
        run: >-
          flutter build macos --release
          --dart-define-from-file=config/production.json

  macos-tvos-compile:
    name: macOS / pinned tvOS simulator compile
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache pinned flutter-tvos toolchain
        uses: actions/cache@v5
        with:
          path: ~/.cache/flutter-tvos/v3.44.7-tvos.1.4.2
          key: ${{ runner.os }}-flutter-tvos-${{ hashFiles('tool/tvos/versions.env') }}

      - name: Bootstrap and verify pinned flutter-tvos
        run: tool/tvos/bootstrap.sh

      - name: Resolve tvOS dependencies
        run: tool/tvos/flutter-tvos.sh pub get

      - name: Compile unsigned tvOS simulator application
        run: tool/tvos/build_simulator.sh production

  windows-release-build:
    name: Windows / release build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release with production configuration
        run: >-
          flutter build windows --release
          --dart-define-from-file=config/production.json
