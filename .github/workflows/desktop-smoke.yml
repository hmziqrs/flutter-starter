name: Desktop smoke

# Launches the real app on Windows and Linux, which a Mac cannot do, and runs the
# integration flows there. Runs on feature-branch pushes and publishes nothing.
# Quality gates otherwise stay local; see the README.

on:
  push:
    branches-ignore: [master, 'goldens/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.7
  DEV_CONFIG: config/development.json
  PROD_CONFIG: config/production.json

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake libayatana-appindicator3-dev libcurl4-openssl-dev libgtk-3-dev libsecret-1-dev libstdc++-12-dev xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Development smoke flow
        run: |
          xvfb-run -a flutter test integration_test/development_smoke_test.dart \
            -d linux --dart-define-from-file="$DEV_CONFIG"

      - name: Production routes
        run: |
          xvfb-run -a flutter test integration_test/production_routes_test.dart \
            -d linux --dart-define-from-file="$PROD_CONFIG"

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Development smoke flow
        run: >-
          flutter test integration_test/development_smoke_test.dart
          -d windows --dart-define-from-file=${{ env.DEV_CONFIG }}

      - name: Production routes
        run: >-
          flutter test integration_test/production_routes_test.dart
          -d windows --dart-define-from-file=${{ env.PROD_CONFIG }}
